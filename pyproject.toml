[project]
name = "dota-predictor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "httpx>=0.28.1",
    "joblib>=1.5.3",
    "lightgbm>=4.7.0",
    "pandas>=3.0.5",
    "polars>=1.44.1",
    "psycopg[binary]>=3.2",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0",
    "tenacity>=9.1.4",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
